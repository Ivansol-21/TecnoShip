<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resgistro</title>
    <link rel="icon" type="image/svg+xml" href="/public/Logo.svg" />
    <link rel="stylesheet" href="./RegistroYSesion.css" />
  </head>
  <body>
    <main id="containerRegYSes">
      <section class="slider-regYSes__style">
        <h2 id="sesion">Iniciar Sesión</h2>
        <form action="/login" method="POST" class="form-regYSes__style">
          <label for="login-username">Nombre de usuario:</label>
          <input type="text" id="login-username" name="username" required />
          <br />
          <label for="login-password">Contraseña:</label>
          <input type="password" id="login-password" name="password" required />
          <a href="/forgot-password" class="regYSes_contraseña"
            >¿Olvidaste tu contraseña?</a
          >
          <br />
          <div class="logos-regYSes__container">
            <figure class="logos-regYSes__style">
              <a href="#" class="logos-regYSes__style">
                <img
                  src="../../LogoGoogle.svg"
                  alt="Logo de Google"
                  class="logos-regYSes__style"
                />
              </a>
            </figure>
            <figure class="logos-regYSes__style">
              <a href="#" class="logos-regYSes__style">
                <img
                  src="../../LogoFacebook.svg"
                  alt="Logo de Facebook"
                  class="logos-regYSes"
                />
              </a>
            </figure>
          </div>
          <button type="submit">Iniciar Sesión</button>
          <br />
          <a href="./RegistroYSesion.html?view=registro"
            >¿No tienes cuenta? Regístrate aquí</a
          >
          <br />
          <a href="../../index.html">Volver al inicio</a>
        </form>
      </section>
      <!-- Seccion para registro -->
      <section class="slider-regYSes__style">
        <h2 id="registro">Registro</h2>
        <form action="/registro" method="POST" class="form-regYSes__style">
          <label for="username">Nombre de usuario:</label>
          <input type="text" id="username" name="username" required />
          <br />
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" required />
          <br />
          <label for="confirm-password">Confirmar contraseña:</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            required
          />
          <br />
          <div class="checkbox-regYSes__style">
            <input type="checkbox" id="terms" name="terms" required />
            <label for="terms"
              >Acepto los <a href="/terms">términos y condiciones</a></label
            >
          </div>
          <div class="logos-regYSes__container">
            <figure class="logos-regYSes__style">
              <a href="#" class="logos-regYSes__style">
                <img
                  src="../../LogoGoogle.svg"
                  alt="Logo de Google"
                  class="logos-regYSes__style"
                />
              </a>
            </figure>
            <figure class="logos-regYSes__style">
              <a href="#" class="logos-regYSes__style">
                <img
                  src="../../LogoFacebook.svg"
                  alt="Logo de Facebook"
                  class="logos-regYSes"
                />
              </a>
            </figure>
          </div>
          <button type="submit">Registrar</button>
          <br />
          <a href="./RegistroYSesion.html?view=sesion"
            >¿Ya tienes cuenta? Inicia sesión aquí</a
          >
          <br />
          <a href="../../index.html">Volver al inicio</a>
        </form>
      </section>
    </main>
    <script type="module" src="./RegistroYSesion.js"></script>
  </body>
</html>
